[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadmailer"
version = "0.1.0"
description = "Small lead finder + email writer + sender (config-driven, SQLite, safety gates)"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
leadmailer = "leadmailer.cli:main"

[tool.setuptools.packages.find]
include = ["leadmailer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
